name: Release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Explicit target stage
        required: true
        type: choice
        options: [staging, prod]
      application_id:
        description: Discord application ID for serialization and identity check
        required: true
        type: string

  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      application_id:
        required: true
        type: string
      revision:
        description: Exact full SHA that passed the caller checks
        required: true
        type: string
    secrets:
      TWITCH_CLIENT_SECRET:
        required: true
      TWITCH_SIGNING_SECRET:
        required: true
      DISCORD_BOT_TOKEN:
        required: true
      OPERATOR_SECRET:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    concurrency:
      group: arc-discord-${{ inputs.application_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_APPLICATION_ID: ${{ inputs.application_id }}
      ARC_STAGE: ${{ inputs.stage }}
      APPLICATION_STAGE: ${{ inputs.stage }}
      ARC_BUILD_REVISION: ${{ inputs.revision || github.sha }}
      ARC_PUBLIC_URL: ${{ vars.ARC_PUBLIC_URL }}
      ARC_ENVIRONMENT: ${{ vars.ARC_ENVIRONMENT }}
      TWITCH_SENDER_KIND: ${{ vars.TWITCH_SENDER_KIND }}
      TWITCH_SENDER_LOGIN: ${{ vars.TWITCH_SENDER_LOGIN }}
      TWITCH_CHANNEL_LOGINS: ${{ vars.TWITCH_CHANNEL_LOGINS }}
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      TWITCH_SIGNING_SECRET: ${{ secrets.TWITCH_SIGNING_SECRET }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      OPERATOR_SECRET: ${{ secrets.OPERATOR_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Guard release origin and identity after acquiring the lock
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const missing = ['TWITCH_CLIENT_SECRET', 'TWITCH_SIGNING_SECRET', 'DISCORD_BOT_TOKEN', 'OPERATOR_SECRET', 'CLOUDFLARE_API_TOKEN'].filter(name => !process.env[name]?.trim());
            if (missing.length) throw new Error(`Configure nonempty environment secrets: ${missing.join(', ')}`);
            const { ARC_STAGE: stage, ARC_BUILD_REVISION: revision, RELEASE_APPLICATION_ID: app, DISCORD_APPLICATION_ID: actual, ARC_PUBLIC_URL: origin } = process.env;
            if (!['prod', 'staging'].includes(stage)) throw new Error('Release stage must be prod or staging');
            if (!/^[a-f0-9]{40}$/.test(revision)) throw new Error('Release revision must be a full SHA');
            if (!/^[0-9]+$/.test(app) || app !== actual) throw new Error('Input application_id must equal environment DISCORD_APPLICATION_ID; configure PROD_DISCORD_APPLICATION_ID for automatic releases');
            if (!['push', 'workflow_dispatch'].includes(context.eventName)) throw new Error('PR origins cannot release');
            if (context.eventName === 'push' && (stage !== 'prod' || context.ref !== 'refs/heads/main' || revision !== context.sha)) throw new Error('Automatic production requires the exact checked main push SHA');
            if (context.eventName === 'workflow_dispatch' && (revision !== context.sha || (stage === 'prod' && context.ref !== 'refs/heads/main'))) throw new Error('Manual production requires main and the dispatch SHA');
            if (!origin) throw new Error('Configure environment ARC_PUBLIC_URL with the exact existing deployed Worker origin');
            const url = new URL(origin);
            if (url.protocol !== 'https:' || url.origin !== origin) throw new Error('ARC_PUBLIC_URL must be the exact HTTPS origin');
            if (context.eventName === 'push') {
              const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
              if (data.object.sha !== revision) throw new Error('Stale automatic main release rejected before mutations');
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run build
      - run: bun --no-env-file run typecheck
      - run: bun --no-env-file run lint
      - run: bun --no-env-file run fmt
      - run: bun --no-env-file run test
      - name: Recheck main immediately before deployment
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (data.object.sha !== process.env.ARC_BUILD_REVISION) throw new Error('Stale automatic main release rejected before mutations');
      - name: Deploy selected stage
        id: deploy
        run: bun --no-env-file run deploy --stage "$ARC_STAGE" --yes
      - name: Synchronize this release's global commands
        id: sync
        run: bun --no-env-file run sync:discord --stage "$ARC_STAGE" --endpoint "$ARC_PUBLIC_URL" --revision "$ARC_BUILD_REVISION" --wait
      - name: Report partial release
        if: failure() && steps.deploy.outcome == 'success' && steps.sync.outcome != 'success'
        run: echo 'Cloudflare deployment succeeded; Discord registration is incomplete. Repair by rerunning a release of the deployed revision.' >> "$GITHUB_STEP_SUMMARY"
