name: Release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Explicit target stage
        required: true
        type: choice
        options: [staging, prod]
      application_id:
        description: Discord application ID for serialization and identity check
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    concurrency:
      group: arc-discord-${{ inputs.application_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_APPLICATION_ID: ${{ inputs.application_id }}
      ARC_STAGE: ${{ inputs.stage }}
      APPLICATION_STAGE: ${{ inputs.stage }}
      ARC_BUILD_REVISION: ${{ github.sha }}
      ARC_PUBLIC_URL: ${{ vars.ARC_PUBLIC_URL }}
      ARC_ENVIRONMENT: ${{ vars.ARC_ENVIRONMENT }}
      TWITCH_SENDER_KIND: ${{ vars.TWITCH_SENDER_KIND }}
      TWITCH_SENDER_LOGIN: ${{ vars.TWITCH_SENDER_LOGIN }}
      TWITCH_CHANNEL_LOGINS: ${{ vars.TWITCH_CHANNEL_LOGINS }}
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      TWITCH_SIGNING_SECRET: ${{ secrets.TWITCH_SIGNING_SECRET }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      OPERATOR_SECRET: ${{ secrets.OPERATOR_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: test "$DISCORD_APPLICATION_ID" = "$RELEASE_APPLICATION_ID"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run test
      - name: Deploy selected stage
        id: deploy
        run: bun run deploy --stage "$ARC_STAGE" --yes
      - name: Synchronize this release's global commands
        id: sync
        run: bun run sync:discord --stage "$ARC_STAGE" --endpoint "$ARC_PUBLIC_URL" --revision "$ARC_BUILD_REVISION" --wait
      - name: Report partial release
        if: failure() && steps.deploy.outcome == 'success' && steps.sync.outcome != 'success'
        run: echo 'Cloudflare deployment succeeded; Discord registration is incomplete. Repair by rerunning a release of the deployed revision.' >> "$GITHUB_STEP_SUMMARY"
