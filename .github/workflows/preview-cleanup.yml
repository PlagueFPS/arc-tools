name: Remove synthetic preview

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Closed PR number whose synthetic preview needs cleanup
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: arc-preview-${{ github.repository }}-${{ github.event.number || inputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted cleanup code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Require installed cleanup implementation
        run: |
          test -f scripts/preview.ts || { echo 'Default branch lacks preview cleanup code during initial rollout. No cleanup was performed. Land the reviewed implementation, then dispatch this workflow for the closed PR or run preview:cleanup locally from the reviewed commit.'; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun --no-env-file install --frozen-lockfile
      - name: Destroy and verify the PR preview
        env:
          PREVIEW_PR: ${{ github.event.number || inputs.pr }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
        run: bun --no-env-file run preview:cleanup --pr "$PREVIEW_PR"
      - name: Retain cleanup recovery journals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-cleanup-recovery-${{ github.event.number || inputs.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cloud-tests/*/run.json
            .cloud-tests/*/resources.json
            .cloud-tests/*/result.json
            .cloud-tests/*/preview-output.json
            .cloud-tests/*/preview-result.json
          include-hidden-files: true
