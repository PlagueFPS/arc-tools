name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check Types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Real Cloudflare integration tests
        id: cloud
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
        run: bun run test:cloud

      - name: Retry disposable Cloudflare cleanup
        if: always() && steps.cloud.outputs.stage != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          ARC_CLOUD_STAGE: ${{ steps.cloud.outputs.stage }}
        run: bun run test:cloud:cleanup

      - name: Preserve cleanup recovery identity
        if: always() && steps.cloud.outputs.stage != ''
        uses: actions/upload-artifact@v4
        with:
          name: cloud-test-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloud-tests/**/*.json
          include-hidden-files: true
