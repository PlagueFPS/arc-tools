name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      DISCORD_APPLICATION_ID: "123456789012345678"
    steps:
      - name: Checkout checked revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run build
      - run: bun --no-env-file run typecheck
      - run: bun --no-env-file run lint
      - run: bun --no-env-file run fmt
      - run: bun --no-env-file run test
      - name: Local workerd integration tests
        id: cloud
        run: bun --no-env-file run test:cloud
      - name: Retry local infrastructure cleanup
        if: always() && steps.cloud.outputs.stage != ''
        env:
          ARC_CLOUD_STAGE: ${{ steps.cloud.outputs.stage }}
        run: bun --no-env-file run test:cloud:cleanup
      - name: Preserve cleanup recovery identity
        if: always() && steps.cloud.outputs.stage != ''
        uses: actions/upload-artifact@v4
        with:
          name: local-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cloud-tests/*/run.json
            .cloud-tests/*/resources.json
            .cloud-tests/*/result.json
            .cloud-tests/*/native-alarm-attribution.jsonl
            .cloud-tests/*/fixture-http-*.jsonl
            .cloud-tests/*/journeys/*.jsonl
            .cloud-tests/*/alarm-observation.json
            .cloud-tests/*/timings.json
            .cloud-tests/*/twitch-timings.json
            .cloud-tests/*/preview-output.json
            .cloud-tests/*/preview-result.json
          include-hidden-files: true

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    with:
      stage: prod
      application_id: ${{ vars.PROD_DISCORD_APPLICATION_ID }}
      revision: ${{ github.sha }}
    secrets:
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      TWITCH_SIGNING_SECRET: ${{ secrets.TWITCH_SIGNING_SECRET }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      OPERATOR_SECRET: ${{ secrets.OPERATOR_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
