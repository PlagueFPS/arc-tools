name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout checked revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run build
      - run: bun --no-env-file run check-types
      - run: bun --no-env-file run lint
      - run: bun --no-env-file run test
      - name: Explain fork isolation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'Fork PR local checks run. Cloud acceptance and resident preview explicitly skip because fork code receives no test credentials.' >> "$GITHUB_STEP_SUMMARY"
      - name: Require trusted cloud configuration
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure repository variable CLOUDFLARE_TEST_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure repository secret CLOUDFLARE_TEST_API_TOKEN'; exit 1; }
      - name: Real Cloudflare integration tests
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        id: cloud
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
        run: bun --no-env-file run test:cloud
      - name: Retry disposable Cloudflare cleanup
        if: always() && steps.cloud.outputs.stage != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          ARC_CLOUD_STAGE: ${{ steps.cloud.outputs.stage }}
        run: bun --no-env-file run test:cloud:cleanup
      - name: Preserve cleanup recovery identity
        if: always() && steps.cloud.outputs.stage != ''
        uses: actions/upload-artifact@v4
        with:
          name: cloud-test-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cloud-tests/*/run.json
            .cloud-tests/*/resources.json
            .cloud-tests/*/result.json
            .cloud-tests/*/preview-output.json
            .cloud-tests/*/preview-result.json
          include-hidden-files: true

  preview:
    needs: ci
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: arc-preview-${{ github.repository }}-${{ github.event.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun --no-env-file install --frozen-lockfile
      - name: Reconcile synthetic resident preview
        env:
          PREVIEW_PR: ${{ github.event.number }}
          PREVIEW_REVISION: ${{ github.sha }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
        run: bun --no-env-file run preview:deploy --pr "$PREVIEW_PR"
      - name: Retain preview recovery journals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-recovery-${{ github.event.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cloud-tests/*/run.json
            .cloud-tests/*/resources.json
            .cloud-tests/*/result.json
            .cloud-tests/*/preview-output.json
            .cloud-tests/*/preview-result.json
          include-hidden-files: true

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    with:
      stage: prod
      application_id: ${{ vars.PROD_DISCORD_APPLICATION_ID }}
      revision: ${{ github.sha }}
